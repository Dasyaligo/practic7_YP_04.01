<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="OnlyPhones — каталог смартфонов и брендов">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="OnlyPhones">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>OnlyPhones 💗</title>
  <link rel="manifest" href="manifest.json">

  <style>
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #fce4ec 0%, #ffffff 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      z-index: 9999;
      transition: opacity 0.4s ease-out;
    }

    #loading.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-icon {
      font-size: 64px;
      margin-bottom: 12px;
      animation: float 2s ease-in-out infinite;
    }

    .loading-title {
      color: #e91e63;
      margin: 0 0 32px;
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .loading-spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #f8bbd0;
      border-top-color: #e91e63;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      color: #999;
      margin-top: 24px;
      font-size: 14px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loading-icon">📱</div>
    <h1 class="loading-title">OnlyPhones</h1>
    <div class="loading-spinner"></div>
    <p class="loading-text">Загрузка приложения…</p>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (el) {
        el.classList.add('hidden');
        setTimeout(function () { el.remove(); }, 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
